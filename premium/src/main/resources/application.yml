spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/premium}
    username: ${DB_USER:premium}
    password: ${DB_PASSWORD:premium}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

premium:
  delivery-fee: 3.50          # same as FEE in index.html
  free-delivery-over: 25.00   # same as FREE in index.html
  timezone: ${TZ:UTC}         # bakery time zone, used for "date is not in the past"
